<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도형의 방정식 자습</title>
<!-- 수업용 「모두 같은 문제」 — 다른 공용 스크립트보다 먼저 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px 14px 110px}

  header{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;color:var(--tx)}
  .btn:hover{border-color:var(--pri)}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn-ghost{background:#f1f4f9}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.6}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:12px 14px;margin-top:12px;color:#334}
  .explain ol{margin:6px 0 0 0;padding-left:20px}
  .explain li{margin:5px 0}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}
  .pill.u1{background:#e7f0ff;color:#1d4ed8}
  .pill.u2{background:#e8f7ee;color:#0f7a3d}
  .pill.u3{background:#fdf0e2;color:#a85b04}
  .pill.u4{background:#f1e9fc;color:#6d28d9}
  .pill.u5{background:#fde8ef;color:#be185d}

  /* 수식 */
  .mt{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
  .fr{display:inline-block;vertical-align:-0.55em;text-align:center;margin:0 3px}
  .fr > span{display:block;padding:0 4px}
  .fr > span.nu{border-bottom:1.4px solid currentColor}
  .sq{white-space:nowrap}
  .sq > span{border-top:1.4px solid currentColor;padding:0 2px 0 1px;margin-left:-1px}

  /* 공식 상자 */
  .fx{background:#f4f8ff;border:1px solid #d7e5ff;border-radius:12px;padding:12px 14px;margin:10px 0}
  .fx b{color:#1d4ed8}
  .warnbox{background:#fff7e8;border:1px solid #f6e0b5;border-radius:12px;padding:10px 14px;margin:10px 0}

  /* 입력칸 */
  .fields{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:12px;color:var(--dim);font-weight:700}
  .fld input,.fld select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;
        font-size:16px;width:132px;background:#fff;color:var(--tx)}
  .fld input:focus,.fld select:focus{outline:2px solid #bcd3ff;border-color:var(--pri)}
  .fld.good input,.fld.good select{border-color:var(--ok);background:#eafaf1}
  .fld.bad  input,.fld.bad  select{border-color:var(--no);background:#fdeeee}

  .verdict{font-weight:800;margin-top:10px;font-size:16px}
  .verdict.ok{color:var(--ok)}
  .verdict.no{color:var(--no)}
  .combo{font-weight:800;color:var(--warn)}

  /* 주제 목록 */
  .tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .titem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
         cursor:pointer;text-align:left;font:inherit;color:inherit}
  .titem:hover{border-color:var(--pri)}
  .titem b{display:block;font-size:15px;margin:3px 0 2px}
  .titem .d{font-size:12.5px;color:var(--dim);line-height:1.5}
  .done{color:var(--ok);font-weight:800;font-size:12px}

  .bar{height:9px;background:#e8ebf0;border-radius:99px;overflow:hidden;width:110px;flex:none}
  .bar > i{display:block;height:100%;background:var(--pri);transition:width .3s}
  .bar.low > i{background:var(--no)}
  .bar.mid > i{background:var(--warn)}
  .bar.high > i{background:var(--ok)}
  .rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .rec:first-of-type{border-top:0}
  .rec .nm{flex:1;min-width:140px;font-weight:700;font-size:14px}
  .rec .nm small{display:block;font-weight:400;color:var(--dim);font-size:12px}
  .rec .sc{font-weight:800;font-size:15px;width:52px;text-align:right}
  .tagok{color:var(--ok);font-weight:800;font-size:12px}
  .tagno{color:var(--warn);font-weight:800;font-size:12px}
  svg.plane{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
  .figwrap{margin:10px 0;text-align:center}
  table.kv{border-collapse:collapse;margin:8px 0;font-size:14px}
  table.kv td,table.kv th{border:1px solid var(--line);padding:6px 10px}
  table.kv th{background:#f2f5f9}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📐 도형의 방정식 자습</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="practice">✏️ 연습</button>
    <button class="tab"    data-view="exam">🏁 종합시험 20문항</button>
    <button class="tab"    data-view="record">📊 내 기록</button>
    <button class="tab"    data-view="wrong">📕 오답노트</button>
  </div>

  <div id="view"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   도형의 방정식 자습  —  고등 수학(상) Ⅰ. 도형의 방정식
   자습 학습지 01~08차시(중점·무게중심·내분점 / 두 점 사이의 거리·직선의 방정식 /
   점과 직선 사이의 거리·원의 방정식 / 원의 넓이)를 혼자서도 풀 수 있게 만든 도구입니다.

   ▸ 문제는 풀 때마다 숫자가 바뀝니다(생성기 방식).
   ▸ 문제를 더 넣고 싶으면 아래 TOPICS 배열만 고치면 됩니다. → README.md
   규약: https://github.com/hongyul67-cpu/links/blob/master/CONVENTIONS.md
   ══════════════════════════════════════════════════════════════ */

/* ───────── 0) 잔심부름 함수 ───────── */
const $  = s => document.querySelector(s);
const el = h => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const R  = (a,b) => a + Math.floor(Math.random()*(b-a+1));            // a 이상 b 이하 정수
const RZ = (a,b) => { let v; do{ v=R(a,b); }while(v===0); return v; }; // 0 은 빼고
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; };
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a||1; };

/* 분수를 기약분수로 — [분자, 분모], 분모는 항상 양수 */
function red(p,q){ if(q<0){ p=-p; q=-q; } const g=gcd(p,q); return [p/g,q/g]; }
/* 분수를 글자로 : 3/2 · -1/2 · 4 */
function frs(p,q){ const r=red(p,q); return r[1]===1 ? String(r[0]) : r[0]+'/'+r[1]; }
/* 분수를 화면용 HTML 로 */
function frh(p,q){
  const r=red(p,q);
  if(r[1]===1) return N(r[0]);
  const s = r[0]<0 ? '−' : '';
  return s+'<span class="fr"><span class="nu">'+Math.abs(r[0])+'</span><span>'+r[1]+'</span></span>';
}
/* 제곱근 HTML */
function sqh(x){ return '<span class="sq">√<span>'+x+'</span></span>'; }
/* 음수 부호를 수학에서 쓰는 − 로 */
function N(v){ return String(v).replace(/^-/,'−'); }
/* 좌표 HTML */
function P(x,y){ return '('+N(x)+', '+N(y)+')'; }
/* 더하는 식에 쓸 때 음수는 괄호로 : (−3) + 5 */
function par(v){ return v<0 ? '('+N(v)+')' : String(v); }
/* 숫자를 소리 내어 읽었을 때 받침이 있는가 (일·삼·육·칠·팔·십·영) */
const BATCHIM={0:1,1:1,3:1,6:1,7:1,8:1,2:0,4:0,5:0,9:0};
const RIEUL={1:1,7:1,8:1};
function j_eul(v){ return BATCHIM[Math.abs(v)%10] ? '을' : '를'; }
function j_gwa(v){ return BATCHIM[Math.abs(v)%10] ? '과' : '와'; }
function j_i(v){   return BATCHIM[Math.abs(v)%10] ? '이' : '가'; }
function j_ro(v){  const d=Math.abs(v)%10; return (!BATCHIM[d]||RIEUL[d]) ? '로' : '으로'; }
function j_eun(v){ return BATCHIM[Math.abs(v)%10] ? '은' : '는'; }
const X = '<span class="mt">x</span>';
const Y = '<span class="mt">y</span>';
/* 부호 붙여 이어 쓰기 :  + 3 / − 3 */
function sg(v){ return (v<0? ' − ' : ' + ') + Math.abs(v); }
/* 계수 붙은 항 :  3x · −x · x  (c=0 이면 빈 글자) */
function term(c,v){ if(c===0) return ''; if(c===1) return v; if(c===-1) return '−'+v; return c+v; }
/* 부호 붙은 항 :  + 3x / − x */
function sterm(c,v){ if(c===0) return ''; const s = c<0?' − ':' + '; const a=Math.abs(c); return s+(a===1? v : a+v); }
/* ax + by + c = 0 꼴 */
function lineGen(a,b,c){
  let s = term(a,X);
  s += sterm(b,Y);
  if(c!==0) s += sg(c);
  return s + ' = 0';
}
/* y = mx + n 꼴.  m,n 은 정수 또는 [분자,분모] */
function lineMN(m,n){
  const isF = Array.isArray(m);
  const mv = isF ? m[0]/m[1] : m;
  const nv = Array.isArray(n) ? n[0]/n[1] : n;
  let s = Y+' = ';
  if(mv===0){ s += (Array.isArray(n)? frh(n[0],n[1]) : String(n)); return s; }
  if(isF) s += frh(m[0],m[1])+X;
  else s += (m===1?'':(m===-1?'−':String(m)))+X;
  if(nv!==0){
    s += (nv<0?' − ':' + ') + (Array.isArray(n)? frh(Math.abs(n[0]),n[1]) : String(Math.abs(n)));
  }
  return s;
}
/* 숫자 읽기 — "3/2", "-0.5", "( 3 )" 모두 처리 */
function val(s){
  s = String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[()（）]/g,'');
  if(s==='') return NaN;
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){ const d=parseFloat(m[2]); return d===0?NaN:parseFloat(m[1])/d; }
  if(/^[-+]?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  return NaN;
}
function same(u,a){
  const x=val(u), y=val(a);
  if(!isNaN(x) && !isNaN(y)) return Math.abs(x-y) < 1e-9;
  return String(u).trim().replace(/\s+/g,'') === String(a).trim().replace(/\s+/g,'');
}

/* ───────── 1) 좌표평면 그림 (SVG 직접 그리기) ─────────
   items 종류
     {t:'pt',   x,y, label, color}        점
     {t:'seg',  x1,y1,x2,y2, dash}        선분
     {t:'line', a,b,c}                    직선 ax+by+c=0
     {t:'circle', cx,cy, r}               원
*/
function plane(o){
  const xmin=o.xmin, xmax=o.xmax, ymin=o.ymin, ymax=o.ymax;
  const u = o.u || 26;                                  // 1칸 픽셀
  const pad = 14;
  const w = (xmax-xmin)*u + pad*2, h = (ymax-ymin)*u + pad*2;
  const px = x => pad + (x-xmin)*u;
  const py = y => pad + (ymax-y)*u;
  let s = '<svg class="plane" viewBox="0 0 '+w+' '+h+'" width="'+w+'" role="img">';
  s += '<defs><clipPath id="cp'+(plane.n=(plane.n||0)+1)+'"><rect x="'+pad+'" y="'+pad+'" width="'+(w-pad*2)+'" height="'+(h-pad*2)+'"/></clipPath></defs>';
  const cid = 'cp'+plane.n;
  for(let x=xmin;x<=xmax;x++) s += '<line x1="'+px(x)+'" y1="'+pad+'" x2="'+px(x)+'" y2="'+(h-pad)+'" stroke="#eceff4"/>';
  for(let y=ymin;y<=ymax;y++) s += '<line x1="'+pad+'" y1="'+py(y)+'" x2="'+(w-pad)+'" y2="'+py(y)+'" stroke="#eceff4"/>';
  if(ymin<=0&&ymax>=0) s += '<line x1="'+pad+'" y1="'+py(0)+'" x2="'+(w-pad)+'" y2="'+py(0)+'" stroke="#9aa4b2" stroke-width="1.4"/>';
  if(xmin<=0&&xmax>=0) s += '<line x1="'+px(0)+'" y1="'+pad+'" x2="'+px(0)+'" y2="'+(h-pad)+'" stroke="#9aa4b2" stroke-width="1.4"/>';
  for(let x=xmin;x<=xmax;x++){ if(x===0||x%2!==0) continue; s += '<text x="'+px(x)+'" y="'+(py(0)+13)+'" font-size="9" fill="#8b94a3" text-anchor="middle">'+x+'</text>'; }
  for(let y=ymin;y<=ymax;y++){ if(y===0||y%2!==0) continue; s += '<text x="'+(px(0)-5)+'" y="'+(py(y)+3)+'" font-size="9" fill="#8b94a3" text-anchor="end">'+y+'</text>'; }
  s += '<text x="'+(px(0)-5)+'" y="'+(py(0)+12)+'" font-size="9" fill="#8b94a3" text-anchor="end">O</text>';
  (o.items||[]).forEach(function(it){
    const col = it.color || '#2563eb';
    if(it.t==='seg'){
      s += '<line x1="'+px(it.x1)+'" y1="'+py(it.y1)+'" x2="'+px(it.x2)+'" y2="'+py(it.y2)+'" stroke="'+col+'" stroke-width="2"'+(it.dash?' stroke-dasharray="5 4"':'')+'/>';
    } else if(it.t==='line'){
      let p1,p2;
      if(it.b!==0){ p1=[xmin,(-it.c-it.a*xmin)/it.b]; p2=[xmax,(-it.c-it.a*xmax)/it.b]; }
      else { p1=[-it.c/it.a,ymin]; p2=[-it.c/it.a,ymax]; }
      s += '<line clip-path="url(#'+cid+')" x1="'+px(p1[0])+'" y1="'+py(p1[1])+'" x2="'+px(p2[0])+'" y2="'+py(p2[1])+'" stroke="'+col+'" stroke-width="2"'+(it.dash?' stroke-dasharray="5 4"':'')+'/>';
    } else if(it.t==='circle'){
      s += '<circle clip-path="url(#'+cid+')" cx="'+px(it.cx)+'" cy="'+py(it.cy)+'" r="'+(it.r*u)+'" fill="'+(it.fill||'rgba(37,99,235,.07)')+'" stroke="'+col+'" stroke-width="2"/>';
    } else if(it.t==='pt'){
      s += '<circle cx="'+px(it.x)+'" cy="'+py(it.y)+'" r="4" fill="'+col+'"/>';
      if(it.label) s += '<text x="'+(px(it.x)+7)+'" y="'+(py(it.y)-7)+'" font-size="11" font-weight="700" fill="'+col+'">'+it.label+'</text>';
    }
  });
  s += '</svg>';
  return '<div class="figwrap">'+s+'</div>';
}

/* 점들이 다 보이도록 좌표평면 범위를 자동으로 잡아 준다 */
function fit(pts, extra){
  const m = (extra===undefined?1:extra);
  let xmin=0,xmax=0,ymin=0,ymax=0;
  pts.forEach(function(p){ xmin=Math.min(xmin,p[0]); xmax=Math.max(xmax,p[0]);
                           ymin=Math.min(ymin,p[1]); ymax=Math.max(ymax,p[1]); });
  xmin-=m; xmax+=m; ymin-=m; ymax+=m;
  const span=Math.max(xmax-xmin,ymax-ymin);
  const u=Math.max(9,Math.min(24,Math.floor(320/span)));
  return {xmin:xmin,xmax:xmax,ymin:ymin,ymax:ymax,u:u};
}
function planeOf(pts, items, extra){
  const f = fit(pts, extra); f.items = items; return plane(f);
}
/* (x − a)² 꼴 */
function sqx(v,a){
  if(a===0) return v+'²';
  return '('+v+(a>0?' − ':' + ')+Math.abs(a)+')²';
}

/* ══════════════════════════════════════════════════════════════
   ▼▼▼  문제를 더 넣을 곳은 여기부터입니다  ▼▼▼
   TOPICS  = 주제 목록.  주제마다 concept(개념) 과 gens(문제 생성기) 를 갖습니다.
   생성기 하나는 아래 모양의 객체를 돌려주면 됩니다.

     {
       tag   : '오답노트에 남길 짧은 이름',
       q     : '발문 (HTML)',
       fig   : '문제에 함께 보여 줄 그림 (없으면 생략)',
       solFig: '해설에서만 보여 줄 그림 (정답이 보이는 그림은 반드시 여기에)',
       hint  : '공식만 알려 주는 힌트 — 숫자를 대입한 결과는 절대 넣지 말 것',
       fields: [{label:'칸 이름', ans:['정답','다른표기']}, …],
       sol   : ['풀이 1단계','2단계', …]
     }
   ══════════════════════════════════════════════════════════════ */

/* ───── 1. 선분의 중점 ───── */
function g_mid1(){
  const x1=R(-8,8), y1=R(-8,8);
  let x2,y2;
  do{ x2=R(-8,8); }while((x1+x2)%2!==0 || x2===x1);
  do{ y2=R(-8,8); }while((y1+y2)%2!==0 || y2===y1);
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  return {
    _dbg:{A:[x1,y1],B:[x2,y2]},
    tag:'중점 구하기',
    q:'두 점 A'+P(x1,y1)+', B'+P(x2,y2)+' '+j_eul(y2)+' 이은 선분 AB 의 <b>중점 M</b> 의 좌표를 구하시오.',
    fig: planeOf([[x1,y1],[x2,y2]],[{t:'seg',x1:x1,y1:y1,x2:x2,y2:y2},
          {t:'pt',x:x1,y:y1,label:'A'},{t:'pt',x:x2,y:y2,label:'B'}]),
    hint:'중점의 좌표 = 양 끝점 좌표의 <b>평균</b>',
    fields:[{label:'M 의 '+X+'좌표',ans:[String(mx)]},{label:'M 의 '+Y+'좌표',ans:[String(my)]}],
    sol:[
      '중점은 양 끝점 좌표의 <b>평균</b>입니다.',

/* ───── 3. 선분의 내분점 ───── */

/* ───── 4. 두 점 사이의 거리 ───── */
const TRIPLE=[[3,4,5],[4,3,5],[6,8,10],[8,6,10],[5,12,13],[12,5,13],[9,12,15],[12,9,15]];
function g_dist1(){
  const t=pick(TRIPLE);
  const dx=t[0]*pick([1,-1]), dy=t[1]*pick([1,-1]), d=t[2];
  const x1=R(-6,6), y1=R(-6,6);
  const x2=x1+dx, y2=y1+dy;
  return {
    _dbg:{A:[x1,y1],B:[x2,y2]},
    tag:'두 점 사이의 거리',
    q:'좌표평면 위의 두 점 A'+P(x1,y1)+', B'+P(x2,y2)+' 사이의 거리 <b>AB</b> 를 구하시오.',
    fig: planeOf([[x1,y1],[x2,y2]],[{t:'seg',x1:x1,y1:y1,x2:x2,y2:y2},
          {t:'pt',x:x1,y:y1,label:'A'},{t:'pt',x:x2,y:y2,label:'B'}]),
    hint:'AB = '+sqh('('+X+'좌표의 차)² + ('+Y+'좌표의 차)²')+' — 피타고라스 정리 그대로입니다.',
    fields:[{label:'거리 AB',ans:[String(d)]}],
    sol:[
      X+'좌표의 차 : '+x2+' − ('+x1+') = '+dx+' → 제곱하면 '+(dx*dx),
      Y+'좌표의 차 : '+y2+' − ('+y1+') = '+dy+' → 제곱하면 '+(dy*dy),
      'AB = '+sqh(dx*dx+' + '+dy*dy)+' = '+sqh(dx*dx+dy*dy)+' = <b>'+d+'</b>',
      '(차를 제곱하므로 빼는 순서는 상관없습니다.)'
    ]
  };
}
function g_dist2(){
  let x1,y1,x2,y2,a;
  for(let i=0;i<400;i++){
    x1=R(-6,6); y1=RZ(-6,6); x2=R(-6,6); y2=RZ(-6,6);
    if(x1===x2) continue;
    const num=(x2*x2+y2*y2)-(x1*x1+y1*y1), den=2*(x2-x1);
    if(num%den!==0) continue;
    a=num/den;
    if(Math.abs(a)<=9) break;
    a=undefined;
  }
  if(a===undefined) return g_dist1();
  return {
    _dbg:{A:[x1,y1],B:[x2,y2]},
    tag:'축 위에서 같은 거리인 점',
    q:'두 점 A'+P(x1,y1)+', B'+P(x2,y2)+' 에서 <b>같은 거리</b>에 있는 '+X+'축 위의 점 P 의 좌표를 구하시오.',
    fig: planeOf([[x1,y1],[x2,y2]],[{t:'pt',x:x1,y:y1,label:'A'},{t:'pt',x:x2,y:y2,label:'B'}]),
    hint:''+X+'축 위의 점은 '+Y+'좌표가 0 입니다. P(<i>a</i>, 0) 으로 놓고 <b>PA² = PB²</b> 로 식을 세웁니다. (제곱근은 양변에서 사라집니다.)',
    fields:[{label:'P 의 '+X+'좌표',ans:[String(a)]},{label:'P 의 '+Y+'좌표',ans:['0']}],
    sol:[
      'P 가 '+X+'축 위의 점이므로 '+Y+'좌표는 0 입니다. P(<i>a</i>, 0) 이라 놓습니다.',
      'PA² = (<i>a</i> − '+par(x1)+')² + (0 − '+par(y1)+')² = '+(x1===0?'<i>a</i>²':'(<i>a</i>'+sg(-x1)+')²')+' + '+(y1*y1),
      'PB² = (<i>a</i> − '+par(x2)+')² + (0 − '+par(y2)+')² = '+(x2===0?'<i>a</i>²':'(<i>a</i>'+sg(-x2)+')²')+' + '+(y2*y2),
      'PA = PB 이므로 PA² = PB². 전개하여 <i>a</i>² 를 지우면 '+(2*(x2-x1))+'<i>a</i> = '+((x2*x2+y2*y2)-(x1*x1+y1*y1))+' → <i>a</i> = <b>'+a+'</b>',
      '따라서 P'+P(a,0)+' 입니다.'
    ]
  };
}

/* ───── 5. 직선의 방정식 ───── */

/* ───── 7. 점과 직선 사이의 거리 ───── */
function g_pd1(){
  const ab=pick([[3,4],[4,3],[3,-4],[-3,4],[4,-3],[-4,3],[6,8],[8,6],[6,-8],[-8,6]]);
  const a=ab[0], b=ab[1], hyp=Math.round(Math.sqrt(a*a+b*b));
  const p=R(-3,3), q=R(-3,3);
  const k=R(1,4);
  const c=k*hyp-(a*p+b*q);
  return {
    _dbg:{pt:[p,q],L:[a,b,c]},
    tag:'점과 직선 사이의 거리',
    q:'점 '+P(p,q)+' '+j_gwa(q)+' 직선 <b>'+lineGen(a,b,c)+'</b> 사이의 거리를 구하시오.',
    fig: planeOf([[p,q]],[{t:'line',a:a,b:b,c:c,color:'#9aa4b2'},{t:'pt',x:p,y:q,label:'P'}],2),
    hint:'<i>d</i> = <span class="fr"><span class="nu">| 직선의 식에 '+X+', '+Y+' 좌표를 대입한 값 |</span><span>'+sqh('계수의 제곱의 합')+'</span></span> — 분모는 <i>a</i>²+<i>b</i>² 의 제곱근입니다.',
    fields:[{label:'거리 d',ans:[String(k)]}],
    sol:[
      '분자 : | '+N(a)+'×'+par(p)+(b<0?' − ':' + ')+Math.abs(b)+'×'+par(q)+sg(c)+' | = | '+N(a*p)+sg(b*q)+sg(c)+' | = '+Math.abs(a*p+b*q+c),
      '분모 : '+sqh('('+a+')² + ('+b+')²')+' = '+sqh(a*a+b*b)+' = '+hyp,
      '<i>d</i> = '+Math.abs(a*p+b*q+c)+' ÷ '+hyp+' = <b>'+k+'</b>',
      '절댓값을 씌우므로 거리는 항상 0 이상입니다.'
    ]
  };
}
function g_pd2(){
  const mm=pick([[3,4],[-3,4],[4,3],[-4,3]]);
  const mn=mm[0], md=mm[1];
  let A=mn, B=-md, flip=false;
  if(A<0){ A=-A; B=-B; flip=true; }          /* x 의 계수는 양수로 맞추는 것이 보통 */
  const p=R(-3,3), q=R(-3,3);
  const cand=[];
  for(let t=-9;t<=9;t++){
    const num=A*p+B*q+(flip? -md*t : md*t);
    if(num!==0 && num%5===0) cand.push(t);
  }
  const t=pick(cand);
  const C=flip? -md*t : md*t;
  const num=Math.abs(A*p+B*q+C), d=num/5;
  return {
    _dbg:{pt:[p,q],L:[A,B,C]},
    tag:'기울기 꼴 직선과의 거리',
    q:'점 '+P(p,q)+' '+j_gwa(q)+' 직선 <b>'+lineMN([mn,md],t)+'</b> 사이의 거리를 구하시오.',
    fig: planeOf([[p,q]],[{t:'line',a:A,b:B,c:C,color:'#9aa4b2'},{t:'pt',x:p,y:q,label:'P'}],2),
    hint:'거리 공식은 <b><i>ax</i> + <i>by</i> + <i>c</i> = 0 꼴</b>에서만 쓸 수 있습니다. 먼저 이항하고 분모를 없애 정수 계수로 고치세요.',
    fields:[{label:'거리 d',ans:[frs(num,5)]}],
    sol:[
      '먼저 <i>ax</i> + <i>by</i> + <i>c</i> = 0 꼴로 고칩니다. 양변에 '+md+' '+j_eul(md)+' 곱하면 '+md+Y+' = '+term(mn,X)+sg(md*t),
      (flip? '모두 좌변으로 이항하면 '+lineGen(mn,-md,md*t)+' — '+X+' 의 계수를 양수로 만들려고 양변에 −1 을 곱하면 <b>'+lineGen(A,B,C)+'</b>'
           : '모두 좌변으로 이항하면 <b>'+lineGen(A,B,C)+'</b>'),
      '분자 : | '+N(A)+'×'+par(p)+(B<0?' − ':' + ')+Math.abs(B)+'×'+par(q)+sg(C)+' | = | '+N(A*p)+sg(B*q)+sg(C)+' | = '+num,
      '분모 : '+sqh('('+A+')² + ('+B+')²')+' = '+sqh(A*A+B*B)+' = 5',
      '<i>d</i> = '+num+' ÷ 5 = <b>'+frs(num,5)+'</b>'
    ]
  };
}

/* ───── 8. 원의 방정식 (표준형) ───── */

    sol:[

      X+' 의 계수 '+D+' 의 절반은 '+(D/2)+', 제곱하면 '+(a*a)+' — 양변에 더합니다. '

/* ───── 10. 원이 되는 조건 · 원의 넓이의 최댓값 ───── */

        : '→ '+term(al,'<i>k</i>')+' > '+N(-be)+' — 음수로 나누므로 부등호가 <b>뒤집힙니다</b> → <i>k</i> < '+frh(-be,al)),

}
function g_k2(){

  const h=RZ(-3,3);

  eq += sterm(2*be,'<i>a</i>'+Y);
  eq += sterm(ga,'<i>a</i>²');
  eq += sterm(de,'<i>a</i>');
  if(ep!==0) eq += sg(ep);
  eq += ' = 0';
  const r=Math.sqrt(K);
  return {
    _dbg:{al:al,be:be,ga:ga,de:de,ep:ep},
    tag:'원의 넓이의 최댓값',
    q:'원 <b>'+eq+'</b> 의 넓이가 <b>최대</b>가 되도록 하는 <i>a</i> 의 값과, 그때의 반지름의 길이를 구하시오. (단, '+N(lo)+' &lt; <i>a</i> &lt; '+N(hi)+')',
    hint:'넓이 π<i>r</i>² 가 최대 ⟺ <b><i>r</i>² 이 최대</b>. 먼저 완전제곱식으로 고쳐 <i>r</i>² 을 <i>a</i> 에 대한 이차식으로 나타낸 뒤, 다시 완전제곱꼴로 정리합니다.',
    fields:[{label:'a 의 값',ans:[String(h)]},{label:'그때의 반지름',ans:[String(r)]}],
    sol:[
      X+' 부분 : '+X+'²'+sterm(-2*al,'<i>a</i>'+X)+' = ('+X+' − '+term(al,'<i>a</i>')+')² − '+term(al*al,'<i>a</i>²')+'  → 중심의 '+X+'좌표는 '+term(al,'<i>a</i>'),
      Y+' 부분 : '+Y+'²'+sterm(2*be,'<i>a</i>'+Y)+' = ('+Y+' + '+term(be,'<i>a</i>')+')² − '+term(be*be,'<i>a</i>²')+'  → 중심의 '+Y+'좌표는 −'+term(be,'<i>a</i>'),
      '<i>r</i>² = '+term(al*al,'<i>a</i>²')+' + '+term(be*be,'<i>a</i>²')+' − ('+ga+'<i>a</i>²'+sterm(de,'<i>a</i>')+(ep!==0?sg(ep):'')+') = −<i>a</i>²'+sterm(-de,'<i>a</i>')+(ep!==0?sg(-ep):''),
      '완전제곱꼴로 : <i>r</i>² = −(<i>a</i>'+(h>0?' − ':' + ')+Math.abs(h)+')² + '+K,
      '(<i>a</i>'+(h>0?' − ':' + ')+Math.abs(h)+')² 는 0 이상이므로, <i>a</i> = <b>'+N(h)+'</b> 일 때 <i>r</i>² 의 최댓값은 '+K+' 입니다. ('+N(lo)+' &lt; '+N(h)+' &lt; '+N(hi)+' 이므로 범위 안입니다.)',
      '이때 반지름 <i>r</i> = '+sqh(K)+' = <b>'+r+'</b> (넓이는 '+(K===1?'':K)+'π)'
    ]
  };
}


/* ───── 11. 부등식 3종 세트 (준비학습) ───── */
/* 부등호를 화면에 안전하게 찍기 — < 를 그냥 쓰면 태그로 읽힐 수 있다 */
function dh(d){ return d==='>' ? '&gt;' : '&lt;'; }
function flipDir(d){ return d==='>' ? '<' : '>'; }
/* (x − p) 꼴 인수 */
function fac(v){ return '('+X+(v>=0? ' − '+v : ' + '+(-v))+')'; }
/* 수직선 그림 — inside 면 두 수 사이, 아니면 두 수의 바깥 */
function numline(lo,hi,inside){
  const a=lo-3, b=hi+3, u=Math.max(13,Math.min(30,Math.floor(300/(b-a))));
  const pad=20, w=(b-a)*u+pad*2, h=56, y=30;
  const px=x=>pad+(x-a)*u;
  let s='<svg class="plane" viewBox="0 0 '+w+' '+h+'" width="'+w+'" role="img">';
  s+='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#9aa4b2" stroke-width="1.4"/>';
  for(let x=Math.ceil(a);x<=b;x++) s+='<line x1="'+px(x)+'" y1="'+(y-4)+'" x2="'+px(x)+'" y2="'+(y+4)+'" stroke="#d5dae2"/>';
  if(inside) s+='<line x1="'+px(lo)+'" y1="'+y+'" x2="'+px(hi)+'" y2="'+y+'" stroke="#2563eb" stroke-width="4.5"/>';
  else{
    s+='<line x1="'+pad+'" y1="'+y+'" x2="'+px(lo)+'" y2="'+y+'" stroke="#2563eb" stroke-width="4.5"/>';
    s+='<line x1="'+px(hi)+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#2563eb" stroke-width="4.5"/>';
  }
  [lo,hi].forEach(function(t){
    s+='<circle cx="'+px(t)+'" cy="'+y+'" r="4.5" fill="#fff" stroke="#e5484d" stroke-width="2"/>';
    s+='<text x="'+px(t)+'" y="'+(y+20)+'" font-size="11" font-weight="700" fill="#e5484d" text-anchor="middle">'+N(t)+'</text>';
  });
  return '<div class="figwrap">'+s+'</svg></div>';
}
/* 한쪽으로만 뻗는 수직선 (일차부등식의 해) */
function numray(v,dir){
  const a=v-5, b=v+5, u=26, pad=20, w=(b-a)*u+pad*2, h=56, y=30;
  const px=x=>pad+(x-a)*u;
  let s='<svg class="plane" viewBox="0 0 '+w+' '+h+'" width="'+w+'" role="img">';
  s+='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#9aa4b2" stroke-width="1.4"/>';
  for(let x=a;x<=b;x++) s+='<line x1="'+px(x)+'" y1="'+(y-4)+'" x2="'+px(x)+'" y2="'+(y+4)+'" stroke="#d5dae2"/>';
  if(dir==='>') s+='<line x1="'+px(v)+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#2563eb" stroke-width="4.5"/>';
  else          s+='<line x1="'+pad+'" y1="'+y+'" x2="'+px(v)+'" y2="'+y+'" stroke="#2563eb" stroke-width="4.5"/>';
  s+='<circle cx="'+px(v)+'" cy="'+y+'" r="4.5" fill="#fff" stroke="#e5484d" stroke-width="2"/>';
  s+='<text x="'+px(v)+'" y="'+(y+20)+'" font-size="11" font-weight="700" fill="#e5484d" text-anchor="middle">'+N(v)+'</text>';
  return '<div class="figwrap">'+s+'</svg></div>';
}

/* ───── 12. 원과 직선 — 판별식으로 ───── */
function g_sq1(){

    hint:'(A + B)² = A² + 2AB + B², (A − B)² = A² − 2AB + B². 여기서 A = '+term(a,X)+', B = '+b+' 입니다.',

      'B² = '+b+'² = <b>'+c3+'</b>',

function rhsOf(m,n){ return m===0 ? String(n) : term(m,X)+(n!==0?sg(n):''); }
function g_cl1(){
  const want = pick([2,2,0,0,1]);
  let m,n,r;
  if(want===1){ m=0; r=R(2,5); n=r*pick([1,-1]); }
  else{
    let ok=false;
    for(let i=0;i<400 && !ok;i++){
      m=R(-3,3); n=RZ(-7,7); r=R(1,5);
      const D4=r*r*(1+m*m)-n*n;
      ok = (want===2 && D4>0) || (want===0 && D4<0);
    }
    if(!ok) return g_cl1();
  }
  const a1=1+m*m, b1=2*m*n, c1=n*n-r*r;
  const D=b1*b1-4*a1*c1;
  const cnt = D>0?2:(D===0?1:0);
  const verdict = cnt===2?'서로 다른 두 점에서 만난다':(cnt===1?'한 점에서 만난다(접한다)':'만나지 않는다');
  return {
    _dbg:{m:m, n:n, r:r},
    tag:'판별식으로 위치관계',
    q:'다음 직선과 원의 위치관계를 <b>판별식</b>으로 알아보려고 한다. '
      +'판별식 <i>D</i> = <i>b</i>² − 4<i>ac</i> 의 값과 교점의 개수를 구하시오.'
      +'<br>직선 : <b>'+lineMN(m,n)+'</b> &nbsp;&nbsp; 원 : <b>'+X+'² + '+Y+'² = '+(r*r)+'</b>',
    hint:'원의 식에 직선의 식을 <b>대입</b>하면 '+X+' 에 대한 이차방정식이 됩니다. '
        +'그 방정식의 실근의 개수가 곧 교점의 개수이고, 실근의 개수는 판별식의 <b>부호</b>로 압니다.',
    fields:[{label:'판별식 D 의 값',ans:[String(D)]},
            {label:'교점의 개수',type:'select',opts:['0','1','2'],ans:[String(cnt)]}],
    solFig: planeOf([[-r-1,-r-1],[r+1,r+1]],[{t:'circle',cx:0,cy:0,r:r},{t:'line',a:m,b:-1,c:n,color:'#e5484d'}],1),
    sol:[
      '원의 식 '+X+'² + '+Y+'² = '+(r*r)+' 에 '+lineMN(m,n)+' 을 대입합니다.',
      ''+X+'² + ('+rhsOf(m,n)+')² = '+(r*r)+' → 전개하여 정리하면 <b>'+term(a1,X+'²')+sterm(b1,X)+(c1!==0?sg(c1):'')+' = 0</b>',
      '<i>D</i> = '+par(b1)+'² − 4 × '+a1+' × '+par(c1)+' = '+N(b1*b1)+' − '+N(4*a1*c1)+' = <b>'+N(D)+'</b>',
      '<i>D</i> '+(D>0?'&gt; 0':(D===0?'= 0':'&lt; 0'))+' 이므로 <b>'+verdict+'</b> — 교점은 <b>'+cnt+'</b>개입니다.'
    ]
  };
}
function g_cl2(){

      (m===0? '<i>D</i> = 0² − 4 × 1 × (<i>k</i>² − '+(r*r)+')'
            : '<i>D</i> = ('+(2*m)+'<i>k</i>)² − 4 × '+(1+m*m)+' × (<i>k</i>² − '+(r*r)+')')+' = 4( '+A+' − <i>k</i>² )',
      '서로 다른 두 점에서 만나려면 <i>D</i> &gt; 0 이어야 하므로 '+A+' − <i>k</i>² &gt; 0, 즉 <b><i>k</i>² &lt; '+A+'</b>',
      '따라서 <b>'+(exact? '−'+sq+' &lt; <i>k</i> &lt; '+sq

    ]

}

/* ───── 13. 원과 직선 — 중심에서의 거리로 ───── */
function g_cl3(){
  const ab=pick([[3,4],[4,3],[3,-4],[-3,4],[6,8],[8,-6],[-6,8]]);
  const a=ab[0], b=ab[1], hyp=Math.round(Math.sqrt(a*a+b*b));
  const p=R(-4,4), q=R(-4,4), r=R(2,6);
  const d=pick([Math.max(0,r-2), Math.max(0,r-1), r, r+1, r+3]);
  const c=d*hyp-(a*p+b*q);
  const cnt = d<r?2:(d===r?1:0);
  const verdict = cnt===2?'서로 다른 두 점에서 만난다':(cnt===1?'한 점에서 만난다(접한다)':'만나지 않는다');
  const circ = (p===0&&q===0) ? X+'² + '+Y+'² = '+(r*r) : stdEq(p,q,r*r);
  return {
    _dbg:{ctr:[p,q], r:r, L:[a,b,c]},
    tag:'거리로 위치관계',
    q:'다음 원과 직선에 대하여, 원의 중심에서 직선까지의 거리 <i>d</i>, 반지름 <i>r</i>, '
      +'그리고 교점의 개수를 구하시오.'

    fields:[{label:'거리 d',ans:[String(d)]},{label:'반지름 r',ans:[String(r)]},

      '= | '+N(a*p)+sg(b*q)+sg(c)+' | ÷ '+sqh(a*a+b*b)+' = '+Math.abs(a*p+b*q+c)+' ÷ '+hyp+' = <b>'+d+'</b>',

function g_cl4(){

function g_cl5(){
  const m=pick([-3,-2,2,3]);

  return {
    _dbg:{m:m, r:r, A:A, kind:kind},
    tag:'거리로 k 의 범위 (기울기 꼴)',
    q:'다음 직선과 원이 <b>'+(kind==='두 점'?'서로 다른 두 점에서 만나도록':'접하도록')+'</b> 하는 실수 <i>k</i> 를 '
      +'<b>중심에서의 거리</b>로 구하려고 한다. <i>k</i>² 와 비교할 수 <i>A</i> 를 구하시오.'
      +'<br>직선 : <b>'+Y+' = '+term(m,X)+' + <i>k</i></b> &nbsp;&nbsp; 원 : <b>'+X+'² + '+Y+'² = '+(r*r)+'</b>',
    hint:'먼저 <i>ax</i> + <i>by</i> + <i>c</i> = 0 꼴로 고쳐 중심 (0, 0) 에서의 거리를 구합니다. '
        +'두 점에서 만나면 <i>d</i> &lt; <i>r</i>, 접하면 <i>d</i> = <i>r</i> 입니다.',
    fields:[{label:'k² 는 A 보다',type:'select',opts:['작다','같다','크다'],ans:[kind==='두 점'?'작다':'같다']},
            {label:'A 의 값',ans:[String(A)]}],
    sol:[
      ''+Y+' = '+term(m,X)+' + <i>k</i> 를 고치면 '+term(m,X)+' − '+Y+' + <i>k</i> = 0',
      '중심 (0, 0) 에서의 거리 <i>d</i> = | <i>k</i> | ÷ '+sqh('('+N(m)+')² + (−1)²')+' = | <i>k</i> | ÷ '+sqh(1+m*m),
      (kind==='두 점'
        ? '<i>d</i> &lt; '+r+' 이어야 하므로 | <i>k</i> | &lt; '+(r===1?'':r)+sqh(1+m*m)+' → 양변을 제곱하면 <b><i>k</i>² &lt; '+A+'</b>'
        : '<i>d</i> = '+r+' 이어야 하므로 | <i>k</i> | = '+(r===1?'':r)+sqh(1+m*m)+' → 양변을 제곱하면 <b><i>k</i>² = '+A+'</b>'),
      '따라서 <b>'+(kind==='두 점'
          ? (exact? '−'+sq+' &lt; <i>k</i> &lt; '+sq : '−'+sqh(A)+' &lt; <i>k</i> &lt; '+sqh(A))
          : (exact? '<i>k</i> = ±'+sq : '<i>k</i> = ±'+sqh(A)))+'</b> 입니다.',
      '판별식으로 풀어도 같은 답이 나옵니다. 두 방법 중 <b>거리 쪽이 계산이 짧습니다.</b>'
    ]
  };
}

/* ───── 15. 대칭이동 (자습 12차시) ───── */
const SYM = [
  {k:'x축',  f:(x,y)=>[x,-y]},
  {k:'y축',  f:(x,y)=>[-x,y]},
  {k:'원점', f:(x,y)=>[-x,-y]},
  {k:'y=x',  f:(x,y)=>[y,x]}
];
function symName(k){ return k==='x축' ? X+'축' : k==='y축' ? Y+'축' : k==='원점' ? '원점' : '직선 '+Y+' = '+X; }
function symRule(k){
  return k==='x축'  ? Y+' 의 부호만 바뀝니다 : ('+X+', '+Y+') → ('+X+', −'+Y+')'
       : k==='y축'  ? X+' 의 부호만 바뀝니다 : ('+X+', '+Y+') → (−'+X+', '+Y+')'
       : k==='원점' ? '둘 다 부호가 바뀝니다 : ('+X+', '+Y+') → (−'+X+', −'+Y+')'
       :              X+' 와 '+Y+' 를 서로 바꿉니다 : ('+X+', '+Y+') → ('+Y+', '+X+')';
}
/* 점의 대칭이동 */
function g_sym1(){
  const x=RZ(-6,6), y=RZ(-6,6);
  const s = pick(SYM);
  const r = s.f(x,y);
  return {
    _dbg:{x:x, y:y, kind:s.k},
    tag:'점의 대칭이동',
    q:'점 '+P(x,y)+j_eul(y)+' <b>'+symName(s.k)+'</b>에 대하여 대칭이동한 점의 좌표를 구하시오.',
    fig: planeOf([[x,y],[r[0],r[1]]],[{t:'pt',x:x,y:y,label:'A'}]),
    solFig: planeOf([[x,y],[r[0],r[1]]],[{t:'pt',x:x,y:y,label:'A'},
            {t:'seg',x1:x,y1:y,x2:r[0],y2:r[1]},{t:'pt',x:r[0],y:r[1],label:'P'}]),
    hint:'대칭이동은 <b>부호를 바꾸거나 자리를 바꾸는 것</b>입니다. '
       +'어떤 축(또는 점, 직선)을 기준으로 뒤집는지 먼저 보세요.',
    fields:[{label:'대칭이동한 점의 x좌표',ans:[String(r[0])]},
            {label:'대칭이동한 점의 y좌표',ans:[String(r[1])]}],
    sol:[
      symName(s.k)+'에 대한 대칭이동은 '+symRule(s.k),
      '점 '+P(x,y)+' 에 적용하면 <b>'+P(r[0],r[1])+'</b> 입니다.'
    ]
  };
}
/* 평행이동한 뒤 대칭이동 — a, b 구하기 */
function g_sym2(){
  const x=RZ(-5,5), y=RZ(-5,5), a=RZ(-4,4), b=RZ(-4,4);
  const s = pick(SYM);
  const mid=[x+a, y+b];
  const r = s.f(mid[0], mid[1]);
  return {
    _dbg:{x:x, y:y, a:a, b:b, kind:s.k, mid:mid},
    tag:'평행이동 뒤 대칭이동',

/* 원의 대칭이동 */
function g_sym3(){
  const cx=RZ(-5,5), cy=RZ(-5,5), r=R(1,4);
  const s = pick(SYM);
  const c2 = s.f(cx,cy);
  return {
    _dbg:{cx:cx, cy:cy, r:r, kind:s.k},
    tag:'원의 대칭이동',
    q:'원 <b>'+stdEq(cx,cy,r*r)+'</b> '+j_eul(r*r)+' <b>'+symName(s.k)+'</b>에 대하여 '
      +'대칭이동한 원의 <b>중심과 반지름</b>을 구하시오.',
    fig: planeOf([[cx-r,cy-r],[cx+r,cy+r],[c2[0]-r,c2[1]-r],[c2[0]+r,c2[1]+r]],
          [{t:'circle',cx:cx,cy:cy,r:r},{t:'pt',x:cx,y:cy,label:'C'}]),
    solFig: planeOf([[cx-r,cy-r],[cx+r,cy+r],[c2[0]-r,c2[1]-r],[c2[0]+r,c2[1]+r]],
          [{t:'circle',cx:cx,cy:cy,r:r},{t:'pt',x:cx,y:cy,label:'C'},
           {t:'circle',cx:c2[0],cy:c2[1],r:r,color:'#e5484d'},{t:'pt',x:c2[0],y:c2[1],label:'C′'}]),
    hint:'원을 뒤집어도 <b>반지름은 그대로</b>입니다. 중심만 점의 대칭이동과 똑같이 옮기면 됩니다.',
    fields:[{label:'대칭이동한 원의 중심 x좌표',ans:[String(c2[0])]},
            {label:'대칭이동한 원의 중심 y좌표',ans:[String(c2[1])]},
            {label:'반지름',ans:[String(r)]}],
    sol:[
      '원의 중심은 '+P(cx,cy)+', 반지름은 '+r+' 입니다.',
      symName(s.k)+' 대칭 : '+symRule(s.k),
      '중심이 '+P(c2[0],c2[1])+' '+j_ro(c2[1])+' 옮겨지고 반지름은 그대로 '+r+' 이므로 '
        +'<b>'+stdEq(c2[0],c2[1],r*r)+'</b> 입니다.'
    ]
  };
}
/* 직선의 대칭이동 */
function g_sym4(){
  const a=pick([2,3,-2,-3,1,-1]), b=pick([2,3,-2,-3,1,-1]), c=RZ(-8,8);
  const s = pick(SYM);
  let A=a, B=b;
  if(s.k==='x축'){ B=-b; }
  else if(s.k==='y축'){ A=-a; }
  else if(s.k==='원점'){ A=-a; B=-b; }
  else { A=b; B=a; }
  return {
    _dbg:{a:a, b:b, c:c, kind:s.k, A:A, B:B},
    tag:'직선의 대칭이동',
    q:'직선 <b>'+lineGen(a,b,c)+'</b>'+'을 <b>'+symName(s.k)+'</b>에 대하여 '
      +'대칭이동한 직선을 <i>ax</i> + <i>by</i> + <i>c</i> = 0 꼴로 나타낼 때, '
      +X+' 의 계수와 '+Y+' 의 계수를 구하시오. (상수항은 '+N(c)+' 그대로입니다)',
    fig: planeOf([[-7,-7],[7,7]],[{t:'line',a:a,b:b,c:c}]),
    solFig: planeOf([[-7,-7],[7,7]],[{t:'line',a:a,b:b,c:c},
            {t:'line',a:A,b:B,c:c,color:'#e5484d'}]),
    hint:'식에서 '+X+' 와 '+Y+' 를 <b>무엇으로 바꿔 넣는지</b>만 기억하면 됩니다. '
       +'상수항은 건드리지 않습니다.',
    fields:[{label:'x 의 계수',ans:[String(A)]},
            {label:'y 의 계수',ans:[String(B)]}],
    sol:[
      symName(s.k)+' 대칭은 식에서 '
        +(s.k==='x축'  ? Y+' 자리에 −'+Y+' 를 넣습니다.'
        : s.k==='y축'  ? X+' 자리에 −'+X+' 를 넣습니다.'
        : s.k==='원점' ? X+' 자리에 −'+X+', '+Y+' 자리에 −'+Y+' 를 넣습니다.'
        :                X+' 와 '+Y+' 를 서로 바꿔 넣습니다.'),
      '넣고 정리하면 <b>'+lineGen(A,B,c)+'</b> 입니다.',
      '따라서 '+X+' 의 계수는 <b>'+N(A)+'</b>, '+Y+' 의 계수는 <b>'+N(B)+'</b> 입니다.'
    ]
  };
}

     {t:'line',a:2,b:-1,c:-3,color:'#12a150',dash:true},
     {t:'line',a:-0.5,b:-1,c:1,color:'#e5484d'}])}
  <p class="muted">파랑 ${Y} = 2${X} + 1 과 초록 ${Y} = 2${X} − 3 은 <b>평행</b>(기울기 둘 다 2),
  빨강 ${Y} = −½${X} + 1 은 파랑과 <b>수직</b>(2 × (−½) = −1).</p>
  <div class="warnbox">⚠ 기울기가 같은데 ${Y}절편까지 같으면 평행이 아니라 <b>같은 직선</b>입니다.</div>` },

{ id:'pd', unit:2, unitName:'Ⅰ-2 직선의 방정식', name:'점과 직선 사이의 거리', pages:'자습 05차시',
  desc:'대입하고 절댓값, 계수 제곱합의 제곱근으로 나누기', gens:[g_pd1,g_pd2], concept:`
  <div class="fx"><b>점과 직선 사이의 거리</b><br>
  점 (<i>x</i><sub>1</sub>, <i>y</i><sub>1</sub>) 과 직선 <i>ax</i> + <i>by</i> + <i>c</i> = 0 사이의 거리
  <i>d</i> = <span class="fr"><span class="nu">| <i>ax</i><sub>1</sub> + <i>by</i><sub>1</sub> + <i>c</i> |</span><span>${sqh('<i>a</i>² + <i>b</i>²')}</span></span></div>
  <p><span class="kw">읽는 법</span> 분자는 <b>직선의 식에 점의 좌표를 그대로 대입</b>하고 절댓값을 씌운 것,
  분모는 <b>${X}, ${Y} 의 계수를 제곱해서 더한 뒤 제곱근</b>을 씌운 것입니다. <i>c</i> 는 분모에 넣지 않습니다.</p>
  <div class="fx">두 가지 모양, 두 가지 쓸모<br>
  ‣ ${Y} = <i>mx</i> + <i>n</i> 꼴 → <b>기울기</b>와 <b>${Y}절편</b>을 한눈에 봄<br>
  ‣ <i>ax</i> + <i>by</i> + <i>c</i> = 0 꼴 → <b>점과 직선 사이의 거리</b>를 계산할 때 씀</div>
  <p><span class="kw">고치는 순서</span> ① 모두 좌변으로 이항 ② 분수가 있으면 분모의 최소공배수를 곱해 정수로.
  예) ${Y} = −<span class="fr"><span class="nu">4</span><span>3</span></span>${X} + 4 → 3${Y} = −4${X} + 12 → 4${X} + 3${Y} − 12 = 0</p>
  ${planeOf([[-1,-1],[6,5]],[{t:'line',a:3,b:-4,c:2,color:'#9aa4b2'},{t:'pt',x:2,y:-3,label:'P(2, −3)'}],2)}
  <p class="muted">점 (2, −3) 과 직선 3${X} − 4${Y} + 2 = 0 사이의 거리 =
  |3·2 − 4·(−3) + 2| ÷ ${sqh('3² + 4²')} = 20 ÷ 5 = 4.</p>
  <div class="warnbox">⚠ 분모는 ${sqh('<i>a</i>² + <i>b</i>²')} 입니다. <i>c</i> 를 함께 제곱해 넣는 실수가 가장 많습니다.</div>` },

{ id:'cir', unit:3, unitName:'Ⅰ-3 원의 방정식', name:'원의 방정식 (표준형)', pages:'자습 06차시',
  desc:'중심과 반지름으로 바로 쓰기', gens:[g_cir1,g_cir2,g_cir3], concept:`
  <div class="fx"><b>원의 방정식 (표준형)</b><br>
  중심이 (<i>a</i>, <i>b</i>) 이고 반지름이 <i>r</i> 인 원 :
  (${X} − <i>a</i>)² + (${Y} − <i>b</i>)² = <i>r</i>²<br>
  특히 중심이 원점이면 ${X}² + ${Y}² = <i>r</i>²</div>
  <p><span class="kw">왜 이렇게 생겼나</span> 원은 <b>중심에서 거리가 같은 점들의 모임</b>입니다.
  중심 (<i>a</i>, <i>b</i>) 에서 점 (${X}, ${Y}) 까지의 거리가 <i>r</i> 이라는 말을 두 점 사이의 거리 공식으로 쓰면
  ${sqh('(' + X + ' − <i>a</i>)² + (' + Y + ' − <i>b</i>)²')} = <i>r</i>, 양변을 제곱하면 위 식입니다.</p>
  <table class="kv"><tr><th>조건</th><th>반지름 구하는 법</th></tr>
  <tr><td>원점을 지난다</td><td>중심에서 원점까지의 거리</td></tr>
  <tr><td>${X}축에 접한다</td><td>|중심의 ${Y}좌표|</td></tr>
  <tr><td>${Y}축에 접한다</td><td>|중심의 ${X}좌표|</td></tr>
  <tr><td>두 점이 지름의 양 끝</td><td>중심 = 두 점의 중점, 반지름 = 두 점 사이 거리 ÷ 2</td></tr></table>
  ${planeOf([[2,-1],[8,5]],[{t:'circle',cx:5,cy:2,r:3},{t:'pt',x:5,y:2,label:'중심(5, 2)',color:'#e5484d'}],1)}
  <p class="muted">위 원은 (${X} − 5)² + (${Y} − 2)² = 9.</p>
  <div class="warnbox">⚠ 괄호 안의 부호는 <b>반대로</b> 읽습니다. (${X} + 4)² 이면 중심의 ${X}좌표는 −4 입니다.<br>
  ⚠ 우변은 반지름이 아니라 <b>반지름의 제곱</b>입니다.</div>` },

{ id:'gen', unit:3, unitName:'Ⅰ-3 원의 방정식', name:'일반형 → 중심·반지름·넓이', pages:'자습 07차시',
  desc:'완전제곱식으로 고치기', gens:[g_gen1], concept:`
  <div class="fx"><b>완전제곱식</b><br>
  ${X}² − 2<i>a</i>${X} + <i>a</i>² = (${X} − <i>a</i>)² &nbsp;&nbsp;/&nbsp;&nbsp; ${X}² + 2<i>b</i>${X} + <i>b</i>² = (${X} + <i>b</i>)²<br>
  → ${X} 의 계수의 <b>절반을 제곱</b>한 값을 더하면 완전제곱식이 됩니다.</div>
  <p><span class="kw">일반형에서 중심·반지름 찾기</span></p>
  <div class="explain"><ol>
  <li>${X} 끼리, ${Y} 끼리 묶고 상수항은 우변으로 넘긴다.</li>
  <li>${X} 의 계수의 절반의 제곱, ${Y} 의 계수의 절반의 제곱을 <b>양변에</b> 더한다.</li>
  <li>좌변을 (${X} − <i>a</i>)² + (${Y} − <i>b</i>)² 로 묶으면 우변이 <i>r</i>² 이다.</li>
  </ol></div>
  <p>예) ${X}² + ${Y}² − 4${X} + 6${Y} − 3 = 0<br>
  → (${X}² − 4${X} + <b>4</b>) + (${Y}² + 6${Y} + <b>9</b>) = 3 + <b>4</b> + <b>9</b><br>
  → (${X} − 2)² + (${Y} + 3)² = 16 → 중심 (2, −3), 반지름 4</p>
  <div class="fx"><b>원의 넓이 = π<i>r</i>²</b> — 반지름의 제곱에 π 를 곱합니다. 반지름을 구하면 끝입니다.</div>
  <div class="warnbox">⚠ 양변에 더해야 합니다. 좌변에만 더하면 식이 달라집니다.<br>
  ⚠ 부호 : (${Y} + 3)² 이면 중심의 ${Y}좌표는 −3 입니다.</div>` },

{ id:'kmax', unit:3, unitName:'Ⅰ-3 원의 방정식', name:'원이 될 조건 · 넓이의 최댓값', pages:'자습 08차시',
  desc:'r² > 0, 그리고 r² 의 최댓값', gens:[g_k1,g_k2], concept:`
  <div class="fx"><b>원이 되기 위한 조건 : (우변) = <i>r</i>² &gt; 0</b><br>
  반지름은 길이이므로 <i>r</i> &gt; 0, 따라서 <i>r</i>² 도 0 보다 커야 합니다.<br>
  우변 = 0 → 점 하나 / 우변 &lt; 0 → 그런 도형은 없음</div>
  <p>예) ${X}² + ${Y}² = 25 는 반지름 5 인 원이지만, ${X}² + ${Y}² = −25 를 만족하는 점은 <b>하나도 없습니다</b>.
  제곱을 더한 값이 음수가 될 수는 없기 때문입니다.</p>
  <div class="warnbox">⚠ 부등식을 정리할 때 <b>음수로 나누면 부등호가 뒤집힙니다</b>. −2<i>k</i> + 6 &gt; 0 → <i>k</i> &lt; 3.</div>
  <div class="fx"><b>넓이의 최댓값</b><br>
  넓이 = π<i>r</i>² 이므로 <b>넓이가 최대 ⟺ <i>r</i>² 이 최대</b>. <i>r</i>² 을 문자에 대한 이차식으로 나타낸 뒤
  완전제곱꼴로 고쳐 최댓값을 찾습니다.</div>
  <p><span class="kw">이차식의 최대·최소</span></p>
  <table class="kv">
  <tr><th>모양</th><th>언제</th><th>값</th></tr>
  <tr><td>(<i>a</i> − 3)² + 1</td><td><i>a</i> = 3</td><td>최솟값 1 (제곱은 0 이상이므로)</td></tr>
  <tr><td>−(<i>a</i> + 2)² + 3</td><td><i>a</i> = −2</td><td>최댓값 3 (앞에 − 가 붙었으므로)</td></tr>
  </table>
  <p class="muted">−( )² 꼴은 괄호가 0 일 때 가장 커집니다. 여기서 &ldquo;가장 큰 <i>r</i>²&rdquo; 이 나옵니다.</p>` },

{ id:'ineq', unit:4, unitName:'Ⅰ-3 원과 직선의 위치관계', name:'부등식 3종 세트 (준비학습)', pages:'자습 09차시',
  desc:'일차 · 이차 · 절댓값', gens:[g_ineq1,g_ineq2,g_ineq3], concept:`
  <p>원과 직선 문제는 마지막에 늘 <b>부등식</b>으로 끝납니다. 먼저 세 가지 부등식을 손에 익힙니다.</p>
  <div class="fx"><b>① 일차부등식</b> — 끼리끼리 모으고 나눈다<br>
  ${X} 항은 왼쪽, 숫자는 오른쪽으로 모은 뒤 ${X} 의 계수로 양변을 나눕니다.<br>
  <b>⚠ 음수로 나누면 부등호가 뒤집힙니다.</b> −3${X} &gt; 6 → ${X} &lt; −2</div>
  <div class="fx"><b>② 이차부등식</b> — 인수분해하고 「크다는 바깥, 작다는 사이」<br>
  (${X} − <i>p</i>)(${X} − <i>q</i>) 에서 <i>p</i> &lt; <i>q</i> 일 때<br>
  ‣ &gt; 0 (0보다 크다) → 두 수의 <b>바깥</b> : ${X} &lt; <i>p</i> 또는 <i>q</i> &lt; ${X}<br>
  ‣ &lt; 0 (0보다 작다) → 두 수의 <b>사이</b> : <i>p</i> &lt; ${X} &lt; <i>q</i></div>
  ${numline(1,3,false)}
  <p class="muted">(${X} − 1)(${X} − 3) &gt; 0 의 해 — 1 과 3 의 <b>바깥</b>.</p>
  ${numline(-2,5,true)}
  <p class="muted">(${X} + 2)(${X} − 5) &lt; 0 의 해 — −2 와 5 의 <b>사이</b>.</p>
  <div class="fx"><b>③ 절댓값이 있는 부등식</b> — 규칙이 ②와 똑같습니다<br>
  ‣ | ${X} | &lt; <i>k</i> → −<i>k</i> &lt; ${X} &lt; <i>k</i> (사이)<br>
  ‣ | ${X} | &gt; <i>k</i> → ${X} &lt; −<i>k</i> 또는 <i>k</i> &lt; ${X} (바깥)<br>
  | ${X} − 1 | &lt; 3 처럼 괄호 안이 ${X} − 1 이면, 먼저 −3 &lt; ${X} − 1 &lt; 3 으로 쓴 뒤 각 변에 1 을 더합니다.</div>
  <div class="warnbox">⚠ 「또는」과 「그리고」를 섞지 마세요. <b>바깥은 두 조각(또는), 사이는 한 덩어리</b>입니다.<br>
  ⚠ ${X}² − 25 &lt; 0 처럼 생겼으면 먼저 (${X} + 5)(${X} − 5) 로 인수분해합니다.</div>` },

{ id:'cline', unit:4, unitName:'Ⅰ-3 원과 직선의 위치관계', name:'원과 직선 — 판별식으로', pages:'자습 10차시',
  desc:'대입해서 이차방정식, D 의 부호', gens:[g_sq1,g_cl1,g_cl2], concept:`
  <div class="fx"><b>완전제곱식의 전개 (준비)</b><br>
  (A + B)² = A² + 2AB + B² &nbsp;&nbsp;/&nbsp;&nbsp; (A − B)² = A² − 2AB + B²<br>
  예) (2${X} + 3)² = (2${X})² + 2×2${X}×3 + 3² = 4${X}² + 12${X} + 9</div>
  <div class="fx"><b>교점의 개수 = 연립방정식의 실근의 개수</b><br>
  원의 식에 직선의 식을 <b>대입</b>하면 ${X} 에 대한 이차방정식이 됩니다.
  그 이차방정식의 실근이 몇 개인지가 곧 교점이 몇 개인지입니다.</div>
  <div class="fx"><b>판별식 <i>D</i> = <i>b</i>² − 4<i>ac</i></b><br>
  <i>D</i> &gt; 0 → 서로 다른 <b>두 점</b>에서 만난다<br>
  <i>D</i> = 0 → <b>한 점</b>에서 만난다 (접한다)<br>
  <i>D</i> &lt; 0 → <b>만나지 않는다</b></div>
  ${planeOf([[-5,-5],[5,5]],[{t:'circle',cx:0,cy:0,r:3},
     {t:'line',a:0,b:1,c:-1,color:'#12a150'},
     {t:'line',a:0,b:1,c:3,color:'#f5a524'},
     {t:'line',a:0,b:1,c:5,color:'#e5484d'}],1)}
  <p class="muted">초록 — 두 점에서 만남(<i>D</i> &gt; 0) · 노랑 — 접함(<i>D</i> = 0) · 빨강 — 만나지 않음(<i>D</i> &lt; 0)</p>
  <p><span class="kw">미지수가 섞여 있을 때</span> 직선이 ${Y} = <i>mx</i> + <i>k</i> 처럼 <i>k</i> 를 품고 있으면,
  <i>D</i> 를 <i>k</i> 에 대한 식으로 정리한 뒤 <i>D</i> &gt; 0 (또는 = 0, &lt; 0) 으로 <b>부등식</b>을 풉니다.
  앞 주제에서 익힌 부등식이 여기서 쓰입니다.</p>
  <div class="warnbox">⚠ 대입한 뒤 <b>완전제곱식을 정확히 전개</b>해야 합니다. 여기서 틀리면 판별식도 전부 틀립니다.<br>
  ⚠ <i>D</i> 의 <i>a</i>, <i>b</i>, <i>c</i> 는 정리한 <b>이차방정식</b>의 계수이지 원이나 직선의 계수가 아닙니다.</div>` },

{ id:'cdist', unit:4, unitName:'Ⅰ-3 원과 직선의 위치관계', name:'원과 직선 — 중심에서의 거리로', pages:'자습 10차시',
  desc:'d 와 r 을 견주기 (더 빠른 방법)', gens:[g_cl3,g_cl4,g_cl5], concept:`
  <div class="fx"><b>중심에서 직선까지의 거리 <i>d</i> 와 반지름 <i>r</i> 을 견준다</b><br>
  <i>d</i> &lt; <i>r</i> → 서로 다른 <b>두 점</b>에서 만난다<br>
  <i>d</i> = <i>r</i> → <b>한 점</b>에서 만난다 (접한다)<br>
  <i>d</i> &gt; <i>r</i> → <b>만나지 않는다</b></div>
  <p><span class="kw">왜 이게 더 빠른가</span> 판별식은 대입하고 전개하고 정리해야 하지만,
  이 방법은 <b>점과 직선 사이의 거리 공식 한 번</b>이면 끝납니다. 같은 문제를 두 방법으로 풀면 답은 당연히 같습니다.</p>
  ${planeOf([[-5,-5],[5,5]],[{t:'circle',cx:0,cy:0,r:3},
     {t:'line',a:0,b:1,c:-1,color:'#12a150'},
     {t:'line',a:0,b:1,c:3,color:'#f5a524'},
     {t:'line',a:0,b:1,c:5,color:'#e5484d'}],1)}
  <p class="muted">초록 <i>d</i> = 1 &lt; 3 · 노랑 <i>d</i> = 3 = <i>r</i> · 빨강 <i>d</i> = 5 &gt; 3 — 앞 주제의 그림과 같은 상황입니다.</p>
  <div class="explain"><b>푸는 순서</b><ol>
  <li>원의 <b>중심</b>과 <b>반지름</b>을 읽는다.</li>
  <li>직선을 <i>ax</i> + <i>by</i> + <i>c</i> = 0 꼴로 고친다.</li>
  <li>거리 공식 <i>d</i> = | <i>ax</i><sub>1</sub> + <i>by</i><sub>1</sub> + <i>c</i> | ÷ ${sqh('<i>a</i>² + <i>b</i>²')} 로 <i>d</i> 를 구한다.</li>
  <li><i>d</i> 와 <i>r</i> 을 견준다.</li>
  </ol></div>
  <div class="warnbox">⚠ <i>k</i> 의 범위를 묻는 문제는 | <i>k</i> | &lt; (어떤 수) 꼴이 됩니다 —
  <b>절댓값 부등식</b>이므로 「사이」로 풀어야 합니다.<br>
  ⚠ 분모가 ${sqh('2')}, ${sqh('5')} 처럼 무리수면 그대로 두고 <b>양변을 제곱</b>해서 비교하면 편합니다.</div>` },
{ id:'trans', unit:5, unitName:'Ⅰ-4 도형의 이동', name:'평행이동', pages:'자습 11차시',
  desc:'옮긴 만큼 더하기 — 점 · 원 · 직선', gens:[g_deg1,g_tr1,g_tr2,g_tr3,g_tr4], concept:`
  <div class="fx"><b>점의 평행이동</b><br>
  점 (${X}, ${Y}) 를 ${X}축의 방향으로 <i>a</i>, ${Y}축의 방향으로 <i>b</i> 만큼 옮기면<br>
  → <b>(${X} + <i>a</i>, ${Y} + <i>b</i>)</b> &nbsp;— 좌표에 이동량을 <b>그대로 더합니다.</b></div>
  ${planeOf([[-1,-1],[6,5]],[{t:'pt',x:1,y:1,label:'A'},{t:'seg',x1:1,y1:1,x2:4,y2:3},
     {t:'pt',x:4,y:3,label:'A′'}],1)}

}

/* ───────── 문제 풀이 진행 ───────── */
let SESSION=null;
function startSession(o){
  const list=[]; let guard=0;
  const pool = o.topics.length>1 ? shuffle(o.topics.slice()) : o.topics;
  while(list.length<o.n && guard++<600){
    const t = pool[list.length % pool.length];
    const p = newProblem(t);
    if(list.length && list[list.length-1].tag===p.tag && Math.random()<0.7) continue;
    list.push(p);
  }
  SESSION={ mode:o.mode, part:o.part, list:list, i:0, correct:0, combo:0, bestCombo:0,
            t0:Date.now(), wrong:[], res:[], graded:false };
  drawQ();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 화면에 답을 적을 때 — 부등호는 escape, 음수는 − 로 */
function esc2(s){ return esc(N(s)); }
/* 화면에 찍힌 -3 같은 음수를 −3 으로. 글자 마디만 고치므로 SVG 좌표는 안전하다 */
function fixMinus(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const hit=[];
  const re=/(^|[\s(=,><\[])-(?=\d)/g;                 /* 「Ⅰ-1」 같은 이름표는 건드리지 않는다 */
  while(w.nextNode()){ if(re.test(w.currentNode.nodeValue)){ re.lastIndex=0; hit.push(w.currentNode); } re.lastIndex=0; }
  hit.forEach(function(n){ n.nodeValue = n.nodeValue.replace(re,'$1−'); });
}

function drawQ(){
  const S=SESSION, p=S.list[S.i], box=$('#view');
  box.innerHTML='';
  const isEx = S.mode==='exam';
  const head = el('<div class="card">'
    +'<div class="row" style="justify-content:space-between">'
      +'<span class="qnum">'+(isEx?'🏁 종합시험':'✏️ 연습 · '+S.part)+' &nbsp; '+(S.i+1)+' / '+S.list.length+'</span>'
      +'<span class="qnum">'+(isEx?'채점은 마지막에':'맞힌 개수 '+S.correct+' &nbsp;<span class="combo">'+(S.combo>1?'🔥 '+S.combo+'연속':'')+'</span>')+'</span>'
    +'</div>'
    +'<div class="progress"><i style="width:'+(S.i/S.list.length*100)+'%"></i></div>'
    +'<div class="qtext">'+p.q+'</div>'
    +(p.fig||'')
    +'<div class="fields" id="flds"></div>'
    +'<div id="hintBox"></div>'
    +'<div class="row" style="margin-top:12px" id="btns"></div>'
    +'<div id="after"></div>'
    +'</div>');
  box.appendChild(head);

  const fl=$('#flds');
  p.fields.forEach(function(f,idx){
    let inner;
    if(f.type==='select'){
      inner='<select data-fi="'+idx+'"><option value=""></option>'
        +f.opts.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('')+'</select>';
    } else {
      inner='<input data-fi="'+idx+'" type="text" inputmode="text" autocomplete="off" placeholder="숫자 또는 3/2">';
    }
    fl.appendChild(el('<div class="fld" id="fld'+idx+'"><label>'+f.label+'</label>'+inner+'</div>'));
  });

  const btns=$('#btns');
  if(!isEx && p.hint){
    const hb=el('<button class="btn">💡 힌트</button>');
    hb.onclick=function(){ $('#hintBox').innerHTML='<div class="explain">'+p.hint+'</div>'; hb.disabled=true; };
    btns.appendChild(hb);
  }
  const go=el('<button class="btn btn-primary">'+(isEx?(S.i+1===S.list.length?'답안 제출하고 채점':'다음 문제 →'):'정답 확인')+'</button>');
  go.onclick=submit;
  btns.appendChild(go);
  if(isEx){
    const sk=el('<span class="muted">모르면 비워 두고 넘어가도 됩니다.</span>');
    btns.appendChild(sk);
  }
  fixMinus(head);
  const first=document.querySelector('[data-fi]');
  if(first) first.focus();
  document.querySelectorAll('[data-fi]').forEach(function(inp){
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); go.click(); } });
  });
  window.scrollTo(0,0);

  function submit(){
    const got=[]; let ok=true;
    p.fields.forEach(function(f,idx){
      const inp=document.querySelector('[data-fi="'+idx+'"]');
      const v=inp?inp.value:'';
      got.push(v);
      const good=f.ans.some(function(a){ return same(v,a); });
      if(!good) ok=false;
      if(!isEx) $('#fld'+idx).classList.add(good?'good':'bad');
    });
    const myText = p.fields.map(function(f,i){ return f.label+' = '+(String(got[i]).trim()?esc2(String(got[i]).trim()):'(빈칸)'); }).join(' / ');
    const ansText= p.fields.map(function(f){ return f.label+' = '+esc2(f.ans[0]); }).join(' / ');
    S.res.push({ id:p.topicId, name:p.topicName, ok:ok });
    if(ok){ S.correct++; S.combo++; S.bestCombo=Math.max(S.bestCombo,S.combo); }
    else {
      S.combo=0;
      S.wrong.push({ no:S.i+1, topicName:p.topicName, tag:p.tag, q:p.q, fig:p.fig||'',
                     solFig:p.solFig||'', sol:p.sol, my:myText, ans:ansText });
    }
    if(isEx){ next(); return; }

    document.querySelectorAll('[data-fi]').forEach(function(i){ i.disabled=true; });
    go.disabled=true;
    if(ok && window.FX){ try{ FX.burst(go); FX.punch(go); }catch(e){} }
    if(!ok && window.FX){ try{ FX.shake(head); }catch(e){} }
    const af=$('#after');
    af.innerHTML='<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'⭕ 정답입니다!'+(S.combo>1?' 🔥 '+S.combo+'연속':''):'❌ 아쉬워요. 풀이를 보고 다시 확인해 보세요.')+'</div>'
      +'<div class="explain"><b>풀이</b><ol>'+p.sol.map(function(s){ return '<li>'+s+'</li>'; }).join('')+'</ol>'
      +'<div style="margin-top:8px;font-weight:800;color:var(--ok)">정답 &nbsp;'+ansText+'</div></div>'
      +(p.solFig||'');
    fixMinus(af);
    const nb=el('<button class="btn btn-primary" style="margin-top:12px">'+(S.i+1===S.list.length?'결과 보기':'다음 문제 →')+'</button>');
    nb.onclick=next; af.appendChild(nb);
    nb.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function next(){
    S.i++;
    if(S.i>=S.list.length) finish(); else drawQ();
  }
}

/* ───────── 결과 ───────── */
function finish(){
  const S=SESSION, box=$('#view'); box.innerHTML='';
  const total=S.list.length, pct=Math.round(S.correct/total*100);
  const sec=Math.round((Date.now()-S.t0)/1000);
  const isEx=S.mode==='exam';

  if(!isEx){
    const key=S.part;
    const tid=(TOPICS.filter(function(t){ return t.name===key; })[0]||{}).id;
    if(tid){ ST.best[tid]=Math.max(ST.best[tid]||0,pct); }
  }
  S.wrong.forEach(function(w){ ST.wrong.push(w); });
  if(ST.wrong.length>60) ST.wrong=ST.wrong.slice(-60);

  /* 주제별로 몇 개 중 몇 개를 맞혔는지 */
  const by={};
  S.res.forEach(function(r){
    const b = by[r.id] || (by[r.id]={ n:0, ok:0, name:r.name });
    b.n++; if(r.ok) b.ok++;
  });
  const weak = Object.keys(by).filter(function(k){ return by[k].ok < by[k].n; })
                     .map(function(k){ return by[k].name+' '+by[k].ok+'/'+by[k].n; });

  /* 주제가 둘 이상이면 「주제별 몇 개 중 몇 개」 요약을 맨 앞에 붙여 보낸다 —
     선생님이 시트의 「틀린 문제」 칸만 봐도 어느 주제가 약한지 알 수 있게 */
  const byKeys = Object.keys(by);
  const summary = byKeys.length>1
    ? ['[주제별] '+byKeys.map(function(k){ return by[k].name.replace(' (준비학습)','')+' '+by[k].ok+'/'+by[k].n; }).join(', ')]
    : [];
  const wrongList = summary.concat(S.wrong.map(function(w){ return w.no+'번 '+w.topicName+' — '+w.tag; }));

  const logId = 'r'+Date.now();
  ST.log.push({ id:logId, t:Date.now(), mode:S.mode, part:S.part, score:pct,
                correct:S.correct, total:total, sec:sec, by:by, sent:false,
                wrongList:wrongList });
  if(ST.log.length>40) ST.log=ST.log.slice(-40);
  save();

  const msg = pct===100?'완벽합니다! 🎉' : pct>=80?'아주 좋아요 👍' : pct>=60?'거의 다 왔어요 💪' : '풀이를 다시 읽어 봅시다 📖';
  box.appendChild(el('<div class="card" style="text-align:center">'
    +'<div class="muted">'+(isEx?'🏁 종합시험':'✏️ 연습 · '+S.part)+'</div>'
    +'<div class="score">'+pct+'점</div>'
    +'<div>'+total+'문항 중 <b>'+S.correct+'</b>문항 정답 · '+sec+'초'
    +(S.bestCombo>1?' · 최고 '+S.bestCombo+'연속':'')+'</div>'
    +'<div style="margin-top:6px;font-weight:700">'+msg+'</div>'
    +'<div id="rankBox" style="margin-top:10px"></div>'
    +'<div id="rSubmitAnchor" style="margin-top:12px"></div>'
    +'</div>'));

  if(window.Rank){
    try{
      const res=Rank.award(pct,{mode:(isEx?'종합시험':S.part)});
      if(res && Rank.resultBox) $('#rankBox').innerHTML=Rank.resultBox(res);
      else if(Rank.card) $('#rankBox').innerHTML=Rank.card();
    }catch(e){}
  }
  if(window.FX && pct>=80){ try{ FX.banner(pct===100?'만점!':'잘했어요!'); }catch(e){} }

  if(S.wrong.length){
    box.appendChild(el('<div class="card"><h3>📕 이번에 틀린 문제 '+S.wrong.length+'개</h3>'
      +'<div class="muted">풀이를 꼭 한 번 읽고 넘어가세요.</div></div>'));
    S.wrong.forEach(function(w){ box.appendChild(wrongCard(w)); });
  } else {
    box.appendChild(el('<div class="card" style="text-align:center">🎯 틀린 문제가 없습니다!</div>'));
  }

  const again=el('<div class="card row">'
    +'<button class="btn btn-primary" id="agn">🔁 다시 풀기 (숫자가 바뀝니다)</button>'
    +'<button class="btn" id="hom">← 처음으로</button></div>');
  box.appendChild(again);
  const part=S.part, mode=S.mode;
  $('#agn').onclick=function(){
    const tops = part==='전체 섞기'||part==='종합시험' ? TOPICS : TOPICS.filter(function(t){ return t.name===part; });
    startSession({mode:mode,topics:tops,n:(mode==='exam'?CFG.examN:CFG.practiceN),part:part});
  };
  $('#hom').onclick=function(){ render(mode==='exam'?'exam':'practice'); };

  /* 결과 제출 (규약 1) */
  const lastResult={
    score:pct, correct:S.correct, total:total, durationSec:sec,
    wrong:wrongList,
    mode:'도형의 방정식 자습 — '+(isEx?'종합시험':'연습 · '+S.part)
  };
  const anchor=$('#rSubmitAnchor');
  const btn=attachSubmit(anchor, lastResult, logId,
      ['도형의 방정식 '+(isEx?'종합시험':S.part)+' '+pct+'점']
        .concat(weak.length? ['보완 필요 — '+weak.join(', ')] : ['출제된 주제를 모두 맞힘']));
  if(btn) btn.textContent='📤 ['+(isEx?'종합시험':S.part)+'] 결과 제출';
  fixMinus(box);
  window.scrollTo(0,0);
}

/* 제출 버튼을 붙이고, 실제로 「제출 완료」가 뜨면 그 기록에 ✔ 를 남긴다.
   공용 collector.js 는 성공 알림이 없으므로 화면에 뜨는 완료 문구를 지켜본다. */
function attachSubmit(anchor, payload, logId, extra){
  if(!anchor) return null;
  if(!(window.ResultCollector && ResultCollector.attach)){
    anchor.appendChild(el('<div class="muted">결과 제출 기능을 불러오지 못했습니다(인터넷 연결 확인).</div>'));
    return null;
  }
  const btn=ResultCollector.attach(anchor, function(){ return payload; }, {
    id:'rc_'+(logId||'now'), className:'btn btn-primary', mode:payload.mode, extra:extra
  });
  if(btn){
    btn.style.width='100%';
    const orig=btn.onclick;
    btn.onclick=function(e){ watchSent(logId); return orig.call(this,e); };
  }
  return btn;
}
let SENT_OBS=null;
function watchSent(logId){
  if(SENT_OBS) SENT_OBS.disconnect();
  SENT_OBS=new MutationObserver(function(){
    const m=document.querySelector('.rc-msg.ok');
    if(m && /완료/.test(m.textContent)){
      SENT_OBS.disconnect(); SENT_OBS=null;
      const e=(ST.log||[]).filter(function(x){ return x.id===logId; })[0];
      if(e){ e.sent=true; e.sentAt=Date.now(); save(); }
      const badge=document.getElementById('sent_'+logId);
      if(badge) badge.outerHTML='<span class="tagok">✔ 제출함</span>';
    }
  });
  SENT_OBS.observe(document.body,{childList:true,subtree:true,characterData:true});
  setTimeout(function(){ if(SENT_OBS){ SENT_OBS.disconnect(); SENT_OBS=null; } }, 300000);
}

/* ───────── 📊 내 기록 ───────── */
function hasRC(){
  try{ return !!(window.ResultCollector && ResultCollector.hasEndpoint && ResultCollector.hasEndpoint()); }
  catch(e){ return false; }
}
function barOf(pct){
  const cls = pct>=80?'high':(pct>=60?'mid':'low');
  return '<span class="bar '+cls+'"><i style="width:'+pct+'%"></i></span>';
}
function when(t){
  const d=new Date(t), n=new Date();
  const same = d.toDateString()===n.toDateString();
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return same ? '오늘 '+hm : (d.getMonth()+1)+'월 '+d.getDate()+'일 '+hm;
}
function renderRecord(box){
  const log=(ST.log||[]).slice();
  if(!log.length){
    box.appendChild(el('<div class="empty">📊 아직 기록이 없어요!<br>'
      +'연습이나 종합시험을 한 번 풀면 여기에 쌓입니다.</div>'));
    return;
  }
  const plays=log.length;
  const avg=Math.round(log.reduce(function(a,e){ return a+e.score; },0)/plays);
  const unsent=log.filter(function(e){ return !e.sent; }).length;
  const secAll=log.reduce(function(a,e){ return a+(e.sec||0); },0);

  box.appendChild(el('<div class="card">'
    +'<h3>📊 내 기록</h3>'
    +'<div class="row" style="gap:18px;margin-top:6px">'
      +'<div><div class="muted">푼 횟수</div><div class="score" style="font-size:26px">'+plays+'</div></div>'
      +'<div><div class="muted">평균 점수</div><div class="score" style="font-size:26px">'+avg+'</div></div>'
      +'<div><div class="muted">공부한 시간</div><div class="score" style="font-size:26px">'+Math.round(secAll/60)+'<span style="font-size:14px">분</span></div></div>'
    +'</div>'
    +'<div id="recRank" style="margin-top:10px"></div>'
    +(unsent? '<div class="warnbox" style="margin-top:10px">📤 아직 선생님께 보내지 않은 기록이 <b>'+unsent+'건</b> 있습니다. '
              +'아래 목록에서 지금 보낼 수 있어요.</div>' : '')
    +'<div class="muted" style="margin-top:10px">'
      +(hasRC()
        ? '제출한 결과는 선생님 구글 시트에 쌓입니다. 이 화면의 기록은 <b>이 기기에만</b> 남습니다.'
        : '지금은 연습용 링크라 제출이 되지 않습니다. 선생님이 나눠 준 링크(주소 뒤에 <code>?rc=</code> 가 붙은 것)로 열면 제출 버튼이 살아납니다. 연습은 이대로 해도 됩니다.')
    +'</div>'
    +'</div>'));
  if(window.Rank && Rank.card){ try{ $('#recRank').innerHTML=Rank.card(); }catch(e){} }

  /* 주제별 정답률 */
  const agg={};
  log.forEach(function(e){
    Object.keys(e.by||{}).forEach(function(k){
      const a=agg[k]||(agg[k]={n:0,ok:0});
      a.n+=e.by[k].n; a.ok+=e.by[k].ok;
    });
  });
  const rows=TOPICS.map(function(t,i){
    const a=agg[t.id];
    if(!a) return '<div class="rec"><div class="nm">'+(i+1)+'. '+t.name
      +'<small>아직 풀지 않았습니다</small></div><span class="muted">—</span></div>';
    const pc=Math.round(a.ok/a.n*100);
    return '<div class="rec"><div class="nm">'+(i+1)+'. '+t.name
      +'<small>'+a.ok+' / '+a.n+' 문항</small></div>'+barOf(pc)
      +'<span class="sc">'+pc+'점</span></div>';
  }).join('');
  box.appendChild(el('<div class="card"><h3>주제별 정답률</h3>'
    +'<div class="muted">연습과 종합시험에서 푼 문항을 모두 합한 것입니다.</div>'
    +'<div style="margin-top:8px">'+rows+'</div></div>'));

  /* 최근 기록 + 나중에 제출 */
  const box2=el('<div class="card"><h3>최근 기록</h3>'
    +'<div class="muted">제출하지 않고 나갔더라도 여기서 다시 보낼 수 있습니다.</div>'
    +'<div id="recList" style="margin-top:8px"></div>'
    +'<div class="row" style="margin-top:12px"><button class="btn" id="clrLog">기록 비우기</button></div></div>');
  box.appendChild(box2);
  const list=$('#recList');
  log.slice().reverse().slice(0,20).forEach(function(e){
    const row=el('<div class="rec">'
      +'<div class="nm">'+(e.mode==='exam'?'🏁 종합시험':'✏️ '+e.part)
        +'<small>'+when(e.t)+' · '+e.correct+'/'+e.total+' · '+e.sec+'초</small></div>'
      +barOf(e.score)+'<span class="sc">'+e.score+'점</span>'
      +'<span id="sent_'+e.id+'">'+(e.sent?'<span class="tagok">✔ 제출함</span>':'<span class="tagno">미제출</span>')+'</span>'
      +'<span id="an_'+e.id+'"></span>'
      +'</div>');
    list.appendChild(row);
    if(!e.sent){
      const btn=attachSubmit(document.getElementById('an_'+e.id), {
        score:e.score, correct:e.correct, total:e.total, durationSec:e.sec,
        wrong:e.wrongList||[],
        mode:'도형의 방정식 자습 — '+(e.mode==='exam'?'종합시험':'연습 · '+e.part)
      }, e.id, ['도형의 방정식 '+(e.mode==='exam'?'종합시험':e.part)+' '+e.score+'점']);
      if(btn){ btn.style.width='auto'; btn.style.marginTop='0'; btn.textContent='📤 제출'; }
    }
  });
  $('#clrLog').onclick=function(){
    if(confirm('내 기록을 모두 지울까요? (제출한 결과는 선생님 시트에 그대로 남습니다)')){
      ST.log=[]; save(); render('record');
    }
  };
}

function wrongCard(w){
  return el('<div class="card">'
    +'<span class="pill">'+w.topicName+(w.tag===w.topicName?'':' · '+w.tag)+'</span>'
    +'<div class="qtext">'+w.no+'. '+w.q+'</div>'
    +(w.fig||'')
    +'<div class="muted">내가 쓴 답 : '+w.my+'</div>'
    +'<div style="color:var(--ok);font-weight:700">정답 : '+w.ans+'</div>'
    +'<div class="explain"><b>풀이</b><ol>'+w.sol.map(function(s){ return '<li>'+s+'</li>'; }).join('')+'</ol></div>'
    +(w.solFig||'')
    +'</div>');
}

/* ───────── 📕 오답노트 ───────── */
function renderWrong(box){
  if(!ST.wrong.length){
    box.appendChild(el('<div class="empty">🗒️ 아직 오답이 없어요!<br>연습이나 종합시험을 풀면 여기에 모입니다.</div>'));
    return;
  }
  const head=el('<div class="card row" style="justify-content:space-between">'
    +'<b>모아 둔 오답 '+ST.wrong.length+'문항</b>'
    +'<button class="btn" id="clrWrong">비우기</button></div>');
  box.appendChild(head);
  $('#clrWrong').onclick=function(){ if(confirm('오답노트를 모두 지울까요?')){ ST.wrong=[]; save(); render('wrong'); } };
  ST.wrong.slice().reverse().forEach(function(w){ box.appendChild(wrongCard(w)); });
}

$('#hdSub').textContent='주제 '+TOPICS.length+'개 · 문제는 풀 때마다 숫자가 바뀝니다';
render('learn');
</script>
